<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎃 Candy or Curse? — AI Food & Halloween Candy Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#241042] via-[#0d0618] to-[#05020a] text-amber-50 antialiased selection:bg-orange-500 selection:text-black">
  <div id="app" class="mx-auto max-w-7xl p-4 sm:p-6"></div>

  <script>
    const QUICK_PREFS = [
      { id: "halal", label: "☪️ Halal", phrase: "I only eat Halal food and avoid gelatin and pork." },
      { id: "vegan", label: "🌱 Vegan", phrase: "I am vegan and avoid gelatin, dairy, and eggs." },
      { id: "vegetarian", label: "🥗 Vegetarian", phrase: "I am vegetarian and avoid gelatin." },
      { id: "no_gelatin", label: "🚫 No Gelatin", phrase: "I strictly avoid gelatin." },
      { id: "peanuts", label: "🥜 Peanut Allergy", phrase: "I have a severe peanut allergy." },
      { id: "tree_nuts", label: "🌰 Hazelnut / Nut Allergy", phrase: "I am allergic to hazelnuts and tree nuts." },
      { id: "gluten", label: "🌾 Gluten-Free", phrase: "I avoid gluten and wheat." },
      { id: "lactose", label: "🥛 Lactose-Free", phrase: "I am lactose intolerant and avoid milk." },
      { id: "eat_everything", label: "🍽️ Eat Everything", phrase: "I eat everything and have no restrictions." }
    ];

    const state = {
      mode: window.location.pathname.startsWith("/scan/") ? "mobile" : "desktop",
      sessionId: window.location.pathname.startsWith("/scan/")
        ? window.location.pathname.split("/scan/")[1]
        : localStorage.getItem("coc_session_id") || null,
      session: null,
      busy: false,
      error: "",
      voiceConfigured: false,
      testJoinToken: "",
      chatDraft: "",
      cameraStream: null,
      isRecording: false,
      cameraActive: false,
      liveStreamMode: false,
      mediaRecorder: null,
      audioChunks: [],
      streamTimer: null,
      recordingTimer: null,
      leaving: false
    };

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const escapeData = (value) => typeof value === "string" ? escapeHtml(value)
      : Array.isArray(value) ? value.map(escapeData)
      : value && typeof value === "object" ? Object.fromEntries(Object.entries(value).map(([k,v]) => [k,escapeData(v)])) : value;
    function attachCamera() {
      const video = document.getElementById("cameraPreview");
      if (video && state.cameraStream) {
        video.srcObject = state.cameraStream;
        video.play().catch(() => {});
      }
    }
    async function checkedJson(res) {
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed. Please try again.");
      return data;
    }
    async function speakText(text) {
      if (!text) return;
      try {
        const res = await fetch("/api/voice/synthesize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.audio_base64 && !String(data.provider).includes("mock")) {
            const audio = new Audio(`data:${data.mime_type};base64,${data.audio_base64}`);
            await audio.play();
            return;
          }
        }
      } catch (_) {}
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.pitch = 0.85;
        u.rate = 0.98;
        window.speechSynthesis.speak(u);
      }
    }

    async function initSession() {
      try {
        const health = await checkedJson(await fetch("/api/health"));
        state.voiceConfigured = health.elevenlabs_api_configured;
        const access = await fetch("/test-access");
        if (access.ok) state.testJoinToken = (await access.json()).join_token || "";
        if (state.sessionId) {
          const res = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}`);
          if (res.ok) {
            state.session = await res.json();
            render();
            return;
          }
        }
        if (state.mode === "mobile") throw new Error("This session is unavailable. Open the desktop app and scan its QR code again.");
        const createRes = await fetch("/api/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        state.session = await checkedJson(createRes);
        state.sessionId = state.session.session_id;
        localStorage.setItem("coc_session_id", state.sessionId);
        render();
      } catch (err) {
        state.error = err.message || "Could not connect. Please reload.";
        render();
      }
    }

    async function sendChat(message) {
      if (!message || !state.sessionId || state.busy || state.isRecording) return;
      state.error = "";
      state.chatDraft = "";
      state.busy = true;
      render();
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await checkedJson(res);
        const refreshed = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}`);
        state.session = await refreshed.json();
        speakText(data.reply);
      } catch (err) {
        state.error = err.message;
        state.chatDraft = message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function runScan({ imageBase64 = "", file = null, hint = "", ingredientText = "" }) {
      if (!state.sessionId || state.busy || state.isRecording) return;
      state.error = "";
      state.busy = true;
      render();
      try {
        let res;
        const q = hint ? `?demo_product_hint=${encodeURIComponent(hint)}` : "";
        if (file) {
          const fd = new FormData();
          fd.append("image", file);
          if (hint) fd.append("demo_product_hint", hint);
          if (ingredientText) fd.append("ingredient_text_override", ingredientText);
          res = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}/scan${q}`, {
            method: "POST",
            body: fd
          });
        } else {
          res = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}/scan${q}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image_base64: imageBase64 || "dGVzdA==",
              mime_type: "image/jpeg",
              demo_product_hint: hint || null,
              ingredient_text_override: ingredientText || null
            })
          });
        }
        const scanResult = await checkedJson(res);
        const refreshed = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}`);
        state.session = await refreshed.json();
        speakText(scanResult.keeper_spoken_summary);
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    function renderOverlay(scan) {
      scan = escapeData(scan);
      if (!scan) {
        return `
          <div class="rounded-3xl border border-white/10 bg-black/30 p-6 text-center text-sm text-amber-200/60">
            🔮 No product scanned yet. Click one of the instant test buttons or scan a product with your phone!
          </div>
        `;
      }
      const styles = {
        GREEN: {
          border: "border-emerald-400 shadow-[0_0_35px_rgba(16,185,129,0.35)]",
          bg: "from-emerald-950/95 via-[#07261d] to-black/95",
          badge: "bg-emerald-400 text-black",
          icon: "🍬",
          label: "GREEN — RECOMMENDED / COMPATIBLE"
        },
        RED: {
          border: "border-rose-500 shadow-[0_0_40px_rgba(244,63,94,0.45)]",
          bg: "from-rose-950/95 via-[#2a0813] to-black/95",
          badge: "bg-rose-500 text-white",
          icon: "💀",
          label: "RED — NOT RECOMMENDED (CONFLICT)"
        },
        YELLOW: {
          border: "border-amber-400 shadow-[0_0_35px_rgba(251,191,36,0.35)]",
          bg: "from-amber-950/95 via-[#291b06] to-black/95",
          badge: "bg-amber-400 text-black",
          icon: "🔮",
          label: "YELLOW — TURN PRODUCT AROUND / UNCERTAIN"
        }
      }[scan.classification] || {
        border: "border-amber-400",
        bg: "from-amber-950 to-black",
        badge: "bg-amber-400 text-black",
        icon: "🔮",
        label: scan.classification
      };

      const guidanceHtml = scan.agent_guidance_prompt
        ? `<div class="mt-4 flex items-center gap-3 rounded-2xl border border-amber-300/60 bg-amber-400/20 p-3.5 text-sm font-extrabold text-amber-100 animate-pulse">
             <span class="text-2xl">🔄</span>
             <div>
               <span class="block text-[10px] uppercase tracking-wider text-amber-300">Live Voice Coach:</span>
               “${scan.agent_guidance_prompt}”
             </div>
           </div>`
        : "";

      const conflictsHtml = (scan.conflicting_ingredients || []).length
        ? `<div class="mt-4 rounded-2xl border border-rose-500/40 bg-black/50 p-3.5 text-left">
             <p class="text-xs font-extrabold uppercase tracking-wider text-rose-300">⚠️ Conflicting Ingredients:</p>
             <div class="mt-2 flex flex-wrap gap-1.5">
               ${scan.conflicting_ingredients.map(i => `<span class="rounded-lg bg-rose-500/25 border border-rose-400/40 px-2.5 py-1 text-xs font-bold text-rose-100">✕ ${i}</span>`).join("")}
             </div>
           </div>`
        : "";

      const altsHtml = (scan.recommended_alternatives || []).length
        ? `<div class="mt-4 rounded-2xl border border-emerald-400/40 bg-emerald-950/50 p-3.5 text-left">
             <p class="text-xs font-extrabold uppercase tracking-wider text-emerald-300">✅ Recommended Similar Alternatives For You:</p>
             <div class="mt-2 grid gap-2 sm:grid-cols-2">
               ${scan.recommended_alternatives.map(alt => `
                 <button onclick="window.triggerHintScan('${alt.product_id}')" class="text-left rounded-xl border border-emerald-400/25 bg-black/40 p-2.5 text-xs hover:border-emerald-400 transition">
                   <div class="font-black text-white">${alt.name}</div>
                   <div class="text-[11px] text-emerald-200/70">${alt.brand}</div>
                   <div class="mt-1 text-[11px] text-emerald-300">${alt.reason}</div>
                 </button>
               `).join("")}
             </div>
           </div>`
        : "";

      return `
        <div class="rounded-3xl border-2 ${styles.border} bg-gradient-to-br ${styles.bg} p-5 text-left transition-all">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="inline-flex items-center gap-1.5 rounded-full px-3.5 py-1 text-xs font-black tracking-wider ${styles.badge}">
              <span>${styles.icon}</span>
              <span>${styles.label}</span>
            </span>
            <span class="rounded-full bg-white/10 px-2.5 py-0.5 text-[11px] font-mono text-amber-200/80">
              ${String(scan.ingredient_source || "").replace(/_/g, " ")} • ${Math.round((scan.recognized_product?.confidence || 0) * 100)}%
            </span>
          </div>
          <h3 class="mt-3 text-2xl font-black text-white">${scan.headline}</h3>
          <p class="mt-1 text-sm font-bold text-amber-300">
            ${scan.recognized_product?.name || "Unknown"} ${scan.recognized_product?.brand ? `<span class="text-amber-200/70">• ${scan.recognized_product.brand}</span>` : ""}
          </p>
          ${guidanceHtml}
          <p class="mt-3 text-sm leading-relaxed text-amber-50/90">${scan.explanation}</p>
          ${conflictsHtml}
          ${altsHtml}
          <p class="mt-4 border-t border-white/15 pt-2.5 text-[11px] text-amber-100/60">🛡️ ${scan.safety_disclaimer}</p>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (!state.session) {
        root.innerHTML = `<div class="p-12 text-center text-lg font-bold text-orange-300">${state.error ? escapeHtml(state.error) : "🎃 Summoning The Candy Keeper..."}</div>`;
        return;
      }

      const restrictions = (state.session.dietary_profile?.parsed_restrictions || []).map(escapeHtml);
      const originToUse = window.location.origin;
      const qrUrl = `${originToUse}/scan/${state.session.session_id}${state.testJoinToken ? "?access_token=" + encodeURIComponent(state.testJoinToken) : ""}`;
      const latestScan = state.session.latest_scan;

      const modeSwitchBtn = state.mode === "desktop"
        ? `<button onclick="window.switchMode('mobile')" class="rounded-xl bg-orange-500 px-4 py-2 text-xs font-black text-black hover:bg-orange-400">📱 Switch to Mobile Camera View</button>`
        : `<button onclick="window.switchMode('desktop')" class="rounded-xl border border-orange-400/50 bg-orange-500/20 px-4 py-2 text-xs font-bold text-orange-200">🖥 Back to Desktop Station</button>`;

      const headerHtml = `
        <header class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-orange-500/30 bg-black/40 px-5 py-3.5 backdrop-blur-md">
          <div class="flex items-center gap-3">
            <span class="text-3xl">🎃</span>
            <div>
              <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-emerald-300">
                CANDY OR CURSE?
              </h1>
              <p class="text-xs text-amber-200/75">
                Live AI Food &amp; Halloween Candy Scanner • Gemma 4 Vision • ElevenLabs Voice • 20 Verified Products
              </p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="rounded-full border border-orange-500/40 bg-orange-950/60 px-3 py-1 text-xs font-mono text-orange-300">
              Session: ${state.session.session_id}
            </span>
            ${modeSwitchBtn}
          </div>
        </header>
        ${state.error ? `<p role="alert" class="mt-3 rounded-xl bg-red-950 p-3 text-red-100">${escapeHtml(state.error)}</p>` : ""}
        ${state.busy ? `<p role="status" class="mt-3 text-amber-200">Working… please wait. Image analysis can take up to a few minutes.</p>` : ""}
      `;

      if (state.mode === "mobile") {
        root.innerHTML = `
          ${headerHtml}
          <div class="mx-auto mt-5 max-w-xl space-y-5">
            <div class="rounded-2xl border border-orange-500/30 bg-orange-950/30 p-3.5">
              <p class="text-[11px] font-extrabold uppercase tracking-wider text-orange-300">Active Dietary Profile:</p>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                ${restrictions.map(r => `<span class="rounded-full bg-orange-500/25 border border-orange-400/40 px-2.5 py-0.5 text-xs font-bold text-orange-200">${r === "eat_everything" ? "✅ Eat Everything" : "⚠️ " + r.replace(/_/g, " ")}</span>`).join("")}
              </div>
            </div>

            <div class="rounded-3xl border border-purple-500/40 bg-purple-950/30 p-5 text-center shadow-2xl">
              <h2 class="text-lg font-black text-orange-300">📷 Smartphone Live Scanner</h2>
              <p class="mt-1 text-xs text-amber-200/75">Film the front of any food product—or flip it around to show the ingredient list!</p>

              <video id="cameraPreview" playsinline muted class="mx-auto mt-3 w-full max-w-sm rounded-2xl bg-black ${state.cameraActive ? "block" : "hidden"}"></video>

              <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button onclick="window.startCameraStream()" class="rounded-2xl bg-purple-700 px-4 py-3 text-xs font-black text-white hover:bg-purple-600">
                  📷 Start Live Camera
                </button>
                <button onclick="window.snapCameraFrame()" class="rounded-2xl bg-orange-500 px-4 py-3 text-xs font-black text-black hover:bg-orange-400">
                  📸 Capture Frame Now
                </button>
              </div>

              <label class="mt-3 block cursor-pointer rounded-2xl border-2 border-dashed border-orange-400/50 bg-orange-500/10 py-3.5 text-sm font-extrabold text-orange-300 hover:bg-orange-500/20">
                📁 Take Photo / Upload Food or Ingredient Image
                <input type="file" accept="image/*" capture="environment" onchange="window.uploadPhotoFile(event)" class="hidden" />
              </label>

              <div class="mt-4 rounded-2xl border border-purple-400/30 bg-black/45 p-3.5 text-left">
                <label class="block text-xs font-extrabold uppercase tracking-wider text-purple-300">
                  📝 Or Paste / Type Ingredient List (DE / EN):
                </label>
                <div class="mt-2 flex gap-2">
                  <input id="ingInput" type="text" placeholder="Zutaten: Zucker, Schweinegelatine, Erdnüsse..." class="flex-1 rounded-xl border border-white/20 bg-black/60 px-3 py-2 text-xs text-white" />
                  <button onclick="window.checkTypedIngredients()" class="rounded-xl bg-purple-600 px-4 py-2 text-xs font-black text-white">Check</button>
                </div>
              </div>

              <div class="mt-4 border-t border-white/10 pt-3 text-left">
                <p class="text-[11px] font-extrabold uppercase tracking-wider text-amber-200/70">⚡ Quick Test Presets:</p>
                <div class="mt-2 grid grid-cols-2 gap-2">
                  <button onclick="window.triggerHintScan('capri-sun-multivitamin')" class="rounded-xl bg-emerald-600/30 border border-emerald-400/50 p-2 text-xs font-bold text-emerald-200">🟢 Capri-Sun (OK)</button>
                  <button onclick="window.triggerHintScan('haribo-goldbears')" class="rounded-xl bg-rose-600/30 border border-rose-400/50 p-2 text-xs font-bold text-rose-200">🔴 Haribo (+Alts)</button>
                  <button onclick="window.triggerHintScan('manner-neapolitaner')" class="rounded-xl bg-rose-600/30 border border-rose-400/50 p-2 text-xs font-bold text-rose-200">🔴 Manner Schnitten</button>
                  <button onclick="window.triggerHintScan('water-bottle-front')" class="rounded-xl bg-amber-600/30 border border-amber-400/50 p-2 text-xs font-bold text-amber-200">🟡 Bottle (“Turn Around!”)</button>
                </div>
              </div>
            </div>

            ${renderOverlay(latestScan)}
          </div>
        `;
        attachCamera();
        return;
      }

      root.innerHTML = `
        ${headerHtml}
        <main class="mt-6 grid gap-6 lg:grid-cols-12">
          <section class="flex flex-col rounded-3xl border border-purple-500/30 bg-purple-950/25 p-5 shadow-2xl lg:col-span-7">
            <div class="flex items-center gap-4 rounded-2xl border border-orange-500/25 bg-gradient-to-r from-purple-950/80 via-[#1f0e38] to-orange-950/40 p-4">
              <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl border border-orange-400/40 bg-orange-500/20 text-4xl">🧙‍♂️</div>
              <div>
                <h2 class="text-lg font-black text-orange-300">The Candy Keeper — AI Food &amp; Candy Coach</h2>
                <p class="mt-0.5 text-xs text-amber-100/80">
                  Pick your preferences below (Halal, Vegan, Allergies, or Eat Everything) or chat with me. Then scan any product front or ingredient list!
                </p>
              </div>
            </div>

            <div class="mt-4">
              <p class="text-xs font-extrabold uppercase tracking-wider text-purple-300">1️⃣ Select Your Dietary Preferences / Allergies:</p>
              <div class="mt-2 flex flex-wrap gap-2">
                ${QUICK_PREFS.map(p => {
                  const active = restrictions.includes(p.id);
                  return `<button onclick="window.sendQuickPref('${p.phrase.replace(/'/g, "\\'")}')" class="rounded-xl border px-3 py-1.5 text-xs font-bold transition ${
                    active
                      ? "border-orange-400 bg-orange-500 text-black shadow-[0_0_15px_rgba(249,115,22,0.5)]"
                      : "border-purple-400/35 bg-purple-900/40 text-amber-100 hover:border-orange-400/60"
                  }">${p.label}</button>`;
                }).join("")}
              </div>
            </div>

            <div class="mt-3 flex flex-wrap items-center gap-1.5 rounded-xl bg-black/35 px-3 py-2">
              <span class="text-[11px] font-bold uppercase text-amber-300/80">Active Filter:</span>
              ${restrictions.map(r => `<span class="rounded-full bg-orange-500/25 border border-orange-400/40 px-2.5 py-0.5 text-[11px] font-extrabold uppercase text-orange-200">${r === "eat_everything" ? "✅ Eat Everything" : "⚠️ " + r.replace(/_/g, " ")}</span>`).join("")}
            </div>

            <div class="mt-4 flex-1 space-y-3 overflow-y-auto max-h-64 pr-1">
              ${(state.session.chat_history || []).map(m => `
                <div class="rounded-2xl p-3.5 text-sm ${
                  m.role === "assistant"
                    ? "bg-purple-900/50 border border-purple-400/30 text-amber-50"
                    : "ml-10 bg-orange-500/25 border border-orange-400/40 text-white"
                }">
                  <span class="mb-1 block text-[10px] font-extrabold uppercase tracking-wider text-orange-300/80">
                    ${m.role === "assistant" ? "🧙‍♂️ The Candy Keeper" : "🧑 You"}
                  </span>
                  ${escapeHtml(m.content)}
                </div>
              `).join("")}
            </div>

            <form onsubmit="window.submitChatForm(event)" class="mt-4 flex gap-2">
              <input id="chatInput" value="${escapeHtml(state.chatDraft)}" oninput="window.updateDraft(this.value)" ${state.busy || state.isRecording ? "disabled" : ""} type="text" placeholder="Type preferences or allergies (e.g. Halal, no gelatin, allergic to nuts)..." class="flex-1 rounded-2xl border border-purple-400/40 bg-black/60 px-4 py-3 text-sm text-white placeholder-amber-200/40 focus:border-orange-400 focus:outline-none" />
              <button type="button" onclick="window.toggleRecording()" ${state.busy || !state.voiceConfigured ? "disabled" : ""} class="rounded-2xl bg-purple-700 px-3 py-2 disabled:opacity-40">${state.isRecording ? "⏹ Stop" : "🎙 Record"}</button>
              <button type="submit" ${state.busy || state.isRecording ? "disabled" : ""} class="rounded-2xl bg-orange-500 px-5 py-3 text-sm font-black text-black hover:bg-orange-400">
                ${state.busy ? "..." : "Send"}
              </button>
            </form>
            <p role="status" class="mt-2 text-xs text-amber-200/75">${state.isRecording ? "Recording… press Stop when finished." : state.voiceConfigured ? "Record your preferences, then review the text before pressing Send." : "Voice input unavailable. Please type your preferences."}</p>

            <div class="mt-4 border-t border-white/10 pt-3">
              <p class="text-[11px] font-bold uppercase tracking-wider text-amber-200/70">⚡ Instant Product Simulator (Click to Test Classification &amp; Alternatives):</p>
              <div class="mt-2 flex flex-wrap gap-2">
                <button onclick="window.triggerHintScan('haribo-goldbears')" class="rounded-xl border border-rose-500/50 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-200 hover:bg-rose-900">🔴 Haribo Goldbären</button>
                <button onclick="window.triggerHintScan('snickers-original')" class="rounded-xl border border-rose-500/50 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-200 hover:bg-rose-900">🔴 Snickers</button>
                <button onclick="window.triggerHintScan('nutella-original')" class="rounded-xl border border-rose-500/50 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-200 hover:bg-rose-900">🔴 Nutella</button>
                <button onclick="window.triggerHintScan('capri-sun-multivitamin')" class="rounded-xl border border-emerald-500/50 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-200 hover:bg-emerald-900">🟢 Capri-Sun</button>
                <button onclick="window.triggerHintScan('voeslauer-mineralwasser')" class="rounded-xl border border-emerald-500/50 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-200 hover:bg-emerald-900">🟢 Vöslauer Wasser</button>
                <button onclick="window.triggerHintScan('water-bottle-front')" class="rounded-xl border border-amber-400/50 bg-amber-950/60 px-3 py-1.5 text-xs font-bold text-amber-200 hover:bg-amber-900">🟡 Bottle (“Turn Around!”)</button>
              </div>
            </div>
          </section>

          <section class="space-y-6 lg:col-span-5">
            <div class="rounded-3xl border border-orange-500/40 bg-black/50 p-5 text-center shadow-2xl">
              <h3 class="text-base font-black text-orange-300">2️⃣ Scan QR to Connect Smartphone Camera</h3>
              <p class="mt-1 text-xs text-amber-200/75">Opens the mobile scanner synced to this session</p>
              <div id="qrcodeBox" class="mx-auto mt-4 inline-block rounded-2xl border-4 border-orange-400 bg-white p-3.5"></div>
              <p class="mt-2 font-mono text-[11px] text-amber-200/80 break-all">${qrUrl}</p>
            </div>

            <div>
              <h4 class="mb-2 text-xs font-extrabold uppercase tracking-wider text-amber-300">🔮 Live Scan Verdict &amp; Recommended Alternatives:</h4>
              ${renderOverlay(latestScan)}
            </div>
          </section>
        </main>
      `;

      const qrContainer = document.getElementById("qrcodeBox");
      if (qrContainer && window.QRCode) {
        qrContainer.innerHTML = "";
        new window.QRCode(qrContainer, {
          text: qrUrl,
          width: 156,
          height: 156
        });
      }
    }

    window.updateDraft = (value) => { state.chatDraft = value; };
    window.toggleRecording = async () => {
      if (state.busy) return;
      state.error = "";
      if (state.isRecording) { state.mediaRecorder.stop(); return; }
      state.busy = true;
      render();
      let stream;
      try {
        if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) throw new Error("Microphone recording is unavailable here. Please type your message.");
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t));
        const recorder = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onerror = () => { stream.getTracks().forEach(t => t.stop()); state.isRecording = false; state.error = "Recording failed. Please type your message."; render(); };
        recorder.onstop = async () => {
          clearTimeout(state.recordingTimer);
          stream.getTracks().forEach(t => t.stop());
          if (state.leaving) return;
          state.isRecording = false;
          state.busy = true;
          render();
          try {
            const type = recorder.mimeType || mime || "audio/webm";
            const blob = new Blob(chunks, {type});
            if (!blob.size) throw new Error("No audio was recorded. Please try again.");
            const form = new FormData();
            form.append("audio", blob, type.includes("mp4") ? "recording.mp4" : "recording.webm");
            const data = await checkedJson(await fetch("/api/voice/transcribe", {method:"POST", body:form}));
            if (String(data.provider).includes("mock") || !data.text?.trim()) throw new Error("No speech could be transcribed. Please type your message.");
            state.chatDraft = data.text.trim();
          } catch (err) { state.error = err.message; }
          finally { state.busy = false; render(); }
        };
        state.mediaRecorder = recorder;
        recorder.start();
        state.recordingTimer = setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, 60000);
        state.isRecording = true;
      } catch (err) {
        stream?.getTracks().forEach(t => t.stop());
        state.error = "Microphone could not start. Check permission or type your message.";
      }
      state.busy = false;
      render();
    };
    window.onpagehide = () => {
      state.leaving = true;
      clearTimeout(state.recordingTimer);
      state.cameraStream?.getTracks().forEach(t => t.stop());
      state.mediaRecorder?.stream?.getTracks().forEach(t => t.stop());
    };
    window.switchMode = (m) => {
      if (state.busy || state.isRecording) return;
      state.mode = m;
      render();
    };
    window.sendQuickPref = (phrase) => sendChat(phrase);
    window.submitChatForm = (e) => {
      e.preventDefault();
      const el = document.getElementById("chatInput");
      if (el && el.value.trim()) {
        sendChat(el.value.trim());
      }
    };
    window.triggerHintScan = (hint) => runScan({ hint });
    window.uploadPhotoFile = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) runScan({ file: f });
    };
    window.checkTypedIngredients = () => {
      const el = document.getElementById("ingInput");
      if (el && el.value.trim()) {
        runScan({ ingredientText: el.value.trim() });
      }
    };
    window.startCameraStream = async () => {
      try {
        state.cameraStream?.getTracks().forEach(t => t.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        state.cameraStream = stream;
        state.cameraActive = true;
        render();
        const video = document.getElementById("cameraPreview");
        if (video) {
          video.srcObject = stream;
          await video.play();
        }
      } catch (_) {
        alert("Camera preview requires HTTPS or permission. Use the 'Take Photo / Upload' button below!");
      }
    };
    window.snapCameraFrame = async () => {
      const video = document.getElementById("cameraPreview");
      if (!video || !video.srcObject) {
        alert("Start the live camera first or use the 'Take Photo / Upload' button!");
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      await runScan({ imageBase64: dataUrl });
    };

    initSession();
    setInterval(async () => {
      if (state.mode === "desktop" && state.sessionId && !state.busy && !state.isRecording) {
        try {
          const res = await fetch(`/api/sessions/${encodeURIComponent(state.sessionId)}`);
          if (res.ok) {
            const updated = await res.json();
            const oldScanId = state.session?.latest_scan?.scan_id;
            const newScanId = updated?.latest_scan?.scan_id;
            const oldCount = (state.session?.chat_history || []).length;
            const newCount = (updated?.chat_history || []).length;
            if (oldScanId !== newScanId || oldCount !== newCount) {
              state.session = updated;
              render();
            }
          }
        } catch (_) {}
      }
    }, 2500);
  </script>
</body>
</html>
